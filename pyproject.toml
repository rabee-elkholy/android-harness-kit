[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "android-agent-harness"
version = "0.28.0"
description = "Deterministic Android Engineering for the AI Era: Turn Any AI Assistant into an Uncompromising Senior Android Engineering Team."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Rabee Elkholy" }]
keywords = ["android", "kmp", "ai-agents", "code-review", "governance", "mcp"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/rabee-elkholy/android-agent-harness"
Issues = "https://github.com/rabee-elkholy/android-agent-harness/issues"

[project.scripts]
android-harness = "harness_cli:main"

[tool.setuptools]
py-modules = ["harness_cli"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*"]
exclude = ["agents.state*", "agents.cache*", "*.__pycache__*"]

[tool.setuptools.package-data]
agents = ["VERSION", "*.json", "*.md", "command-packs/*", "pm/*", "rules/*", "scripts/**/*", "skills/**/*", "subagents/*", "workflows/*", "mcp/**/*", "tool-adapters/**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc", "state/*", "state/**/*", "cache/*", "cache/**/*"]
